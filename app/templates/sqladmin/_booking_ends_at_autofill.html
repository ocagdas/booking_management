<script>
(function () {
  "use strict";

  /**
   * Fetch the duration (minutes) for a service by ID,
   * then compute and set ends_at = starts_at + duration.
   */
  function syncEndsAt(serviceId, startsEl) {
    var endsEl = document.querySelector('[name="ends_at"]');
    if (!endsEl || !startsEl || !serviceId) return;

    var fp = startsEl._flatpickr;
    var start = fp ? fp.selectedDates[0] : null;
    if (!start && startsEl.value) {
      start = new Date(startsEl.value.replace(" ", "T"));
    }
    if (!start || isNaN(start.getTime())) return;

    fetch("/admin/api/services/" + serviceId)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data) return;
        var totalMinutes = data.duration_minutes + (data.buffer_after_minutes || 0);
        var end = new Date(start.getTime() + totalMinutes * 60000);
        var endsFp = endsEl._flatpickr;
        if (endsFp) {
          endsFp.setDate(end, true);
        } else {
          /* fallback: write ISO-like string the server accepts */
          var pad = function (n) { return String(n).padStart(2, "0"); };
          endsEl.value =
            end.getFullYear() + "-" + pad(end.getMonth() + 1) + "-" + pad(end.getDate()) +
            " " + pad(end.getHours()) + ":" + pad(end.getMinutes()) + ":00";
        }
      });
  }

  function init() {
    var serviceEl = document.querySelector('select[name="service"]');
    var startsEl  = document.querySelector('[name="starts_at"]');
    if (!serviceEl || !startsEl) return;

    /* service select changed */
    serviceEl.addEventListener("change", function () {
      syncEndsAt(this.value, startsEl);
    });

    /* starts_at changed — hook flatpickr via fp.set() which is the
       supported API for adding onChange handlers after initialisation.
       Also bind the plain "change" and "input" events as a fallback for
       browsers / themes that don't use flatpickr. */
    var fp = startsEl._flatpickr;
    if (fp) {
      var existing = fp.config.onChange || [];
      fp.set("onChange", existing.concat([function () {
        syncEndsAt(serviceEl.value, startsEl);
      }]));
    }
    /* Always add DOM-level listeners so manual keyboard edits are caught too */
    startsEl.addEventListener("change", function () {
      syncEndsAt(serviceEl.value, startsEl);
    });
    startsEl.addEventListener("input", function () {
      syncEndsAt(serviceEl.value, startsEl);
    });
  }

  /* Wait for flatpickr to finish initialising — use a slightly longer
     delay on edit pages where the widget may repaint after loading data. */
  function tryInit(attemptsLeft) {
    var startsEl = document.querySelector('[name="starts_at"]');
    if (startsEl && startsEl._flatpickr) {
      init();
    } else if (attemptsLeft > 0) {
      setTimeout(function () { tryInit(attemptsLeft - 1); }, 150);
    } else {
      init(); /* run anyway, DOM listeners will still work */
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { tryInit(5); });
  } else {
    tryInit(5);
  }
})();
</script>
