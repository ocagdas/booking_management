<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Book a Service{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    h1, h2 { margin-bottom: 0.5rem; }
    p.subtitle { color: #555; margin-top: 0; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .card h3 { margin: 0 0 0.25rem; }
    .card p { margin: 0 0 0.75rem; color: #555; font-size: 0.9rem; }
    .btn { display: inline-block; background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 0.5rem 1.25rem; cursor: pointer; font-size: 1rem; text-decoration: none; }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #6b7280; }
    .btn-secondary:hover { background: #4b5563; }
    label { display: block; margin-bottom: 0.25rem; font-weight: 500; }
    input, select, textarea { width: 100%; padding: 0.4rem 0.6rem; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; margin-bottom: 1rem; }
    .status-confirmed { color: #16a34a; font-weight: bold; }
    .status-pending { color: #ca8a04; font-weight: bold; }
    .error { color: #dc2626; }
    .breadcrumb { font-size: 0.85rem; color: #888; margin-bottom: 1.5rem; }
    .breadcrumb a { color: #2563eb; text-decoration: none; }
    #slot-results .slot { padding: 0.4rem 0.8rem; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; }
    #slot-results .slot button { padding: 0.25rem 0.75rem; font-size: 0.85rem; }
  </style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
