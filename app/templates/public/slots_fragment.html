{% for slot in slots %}
<div class="slot{% if slot.booked %} slot--booked{% endif %}">
  <span>{{ slot.iso }}</span>
  {% if slot.booked %}
  <span class="btn btn--disabled" aria-disabled="true" style="opacity:.45;cursor:not-allowed">Unavailable</span>
  {% else %}
  <a class="btn" href="/book/{{ business_slug }}/{{ service_id }}/details?starts_at={{ slot.iso }}">Select</a>
  {% endif %}
</div>
{% else %}
<p style="color:#888">No available slots for this date.</p>
{% endfor %}
