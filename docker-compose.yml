services:
  app:
    build:
      context: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      ZMART_BOOKING_DATABASE_HOST: db
      ZMART_BOOKING_DATABASE_NAME: zmart_booking
      ZMART_BOOKING_DATABASE_PASSWORD: postgres
      ZMART_BOOKING_DATABASE_PORT: 5432
      ZMART_BOOKING_DATABASE_USER: postgres
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zmart_booking
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zmart_booking"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

